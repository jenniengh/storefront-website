<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact Us | Craft Trails</title><link rel="stylesheet" href="style.css"></head><body><header><div class="header-inner"><a class="logo" href="index.html">Craft Trails</a><nav aria-label="Main navigation"><a href="index.html" >Home</a><a href="shop.html" >Shop</a><a href="product-details.html" >Product Details</a><a href="cart.html" >Shopping Cart</a><a href="checkout.html" >Checkout</a><a href="confirmation.html" >Confirmation</a><a href="contact.html" aria-current="page">Contact Us</a></nav></div></header><main><section><h1>Contact Us</h1><form id="contact-form" novalidate><div class="form-grid"><div><label>Full Name</label><input id="full-name"></div><div><label>Email Address *</label><input id="email" type="email" required><div class="field-error" id="email-error"></div></div><div class="full-width"><label>Subject</label><input id="subject"></div><div class="full-width"><label>Message *</label><textarea id="message" required></textarea><div class="field-error" id="message-error"></div></div></div><button>Send Message</button><div id="contact-message"></div></form></section><script>document.getElementById('contact-form').addEventListener('submit',e=>{e.preventDefault();let em=document.getElementById('email'),msg=document.getElementById('message'),valid=true;if(!em.value.trim()){document.getElementById('email-error').textContent='Email Address is required.';em.classList.add('invalid');valid=false}else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim())){document.getElementById('email-error').textContent='Enter a valid email address.';em.classList.add('invalid');valid=false}else{em.classList.add('valid');document.getElementById('email-error').textContent=''}if(!msg.value.trim()){document.getElementById('message-error').textContent='Message is required.';msg.classList.add('invalid');valid=false}else{msg.classList.add('valid');document.getElementById('message-error').textContent=''}document.getElementById('contact-message').innerHTML=valid?'<div class="success">Thank you! Your message has been validated and is ready to send.</div>':'<p class="field-error">Please complete the required fields.</p>'});</script></main><footer><p>&copy; 2026 Craft Trails. Handmade supplies for creative trails.</p></footer></body></html>
