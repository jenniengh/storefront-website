<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | Craft Trails</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="header-inner"><a class="logo" href="index.html">Craft Trails</a><nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="product-details.html">Product Details</a><a href="cart.html">Shopping Cart</a><a href="checkout.html" aria-current="page">Checkout</a><a href="confirmation.html">Confirmation</a><a href="contact.html">Contact Us</a></nav></div></header><main><section><h1>Checkout</h1><div id="empty" class="card" hidden><h2>Your cart is empty</h2><a class="button" href="shop.html">Return to Shop</a></div><form id="checkout-form" novalidate><h2>Order Summary</h2><div id="items" class="summary"></div><p>Subtotal: <strong id="subtotal"></strong></p><p id="discount-line"></p><p class="cart-total">Order Total: <strong id="total"></strong></p><h2>Shipping Information</h2><div class="form-grid"><div><label>Full Name *</label><input id="shipping-name" required></div><div><label>Phone Number *</label><input id="phone" required></div><div class="full-width"><label>Street Address *</label><input id="address" required></div><div><label>City *</label><input id="city" required></div><div><label>State *</label><input id="state" required></div><div><label>ZIP Code *</label><input id="zip" required></div></div><h2>Purchase Information</h2><div class="form-grid"><div><label>Cardholder Name *</label><input id="cardholder" required></div><div><label>Credit Card Number *</label><input id="card" required></div><div><label>Expiration Date *</label><input id="expiry" placeholder="MM/YY" required></div><div><label>Security Code *</label><input id="security" required></div><div class="full-width"><label>Coupon Code</label><input id="coupon" placeholder="CRAFT10 or TRAILS15"></div></div><button type="submit">Complete Purchase</button><div id="msg"></div></form></section></main><footer><p>&copy; 2026 Craft Trails. Handmade supplies for creative trails.</p></footer>
<script src="cart.js"></script><script>
const c=getCart(),form=document.getElementById('checkout-form');if(!c.length){form.hidden=true;document.getElementById('empty').hidden=false}
function coupon(){let code=document.getElementById('coupon').value.trim().toUpperCase(),rates={CRAFT10:.10,TRAILS15:.15},sub=cartTotal(),d=rates[code]?sub*rates[code]:0;document.getElementById('subtotal').textContent='$'+sub.toFixed(2);document.getElementById('discount-line').textContent=code?(rates[code]?`Coupon ${code} applied: -$${d.toFixed(2)}`:'Coupon code not found. No discount applied.'):'';document.getElementById('total').textContent='$'+(sub-d).toFixed(2)}
document.getElementById('coupon').addEventListener('input',coupon);document.getElementById('items').innerHTML=c.map(x=>`<p><strong>${x.name}</strong> × ${x.quantity} — $${(x.price*x.quantity).toFixed(2)}</p>`).join('');coupon();
form.addEventListener('submit',e=>{e.preventDefault();let ids=['shipping-name','phone','address','city','state','zip','cardholder','card','expiry','security'],ok=true;ids.forEach(id=>{let x=document.getElementById(id);if(!x.value.trim()){x.classList.add('invalid');ok=false}else{x.classList.remove('invalid')}});if(!/^[0-9+()\-\s]{10,}$/.test(document.getElementById('phone').value.trim()))ok=false;if(!/^\d{5}(-\d{4})?$/.test(document.getElementById('zip').value.trim()))ok=false;if(!/^(?:\d[ -]?){13,19}$/.test(document.getElementById('card').value.trim()))ok=false;if(!/^(0[1-9]|1[0-2])\/\d{2}$/.test(document.getElementById('expiry').value.trim()))ok=false;if(!/^\d{3,4}$/.test(document.getElementById('security').value.trim()))ok=false;if(!ok){document.getElementById('msg').innerHTML='<p class="field-error">Please complete all required fields correctly.</p>';return}let order={orderNumber:'CT-'+Date.now().toString().slice(-8),items:c,total:document.getElementById('total').textContent};localStorage.setItem('craftTrailsLastOrder',JSON.stringify(order));localStorage.removeItem(CART_KEY);location.href='confirmation.html'});
</script></body></html>
