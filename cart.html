<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Shopping Cart | Craft Trails</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="header-inner"><a class="logo" href="index.html">Craft Trails</a><nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="product-details.html">Product Details</a><a href="cart.html" aria-current="page">Shopping Cart</a><a href="checkout.html">Checkout</a><a href="confirmation.html">Confirmation</a><a href="contact.html">Contact Us</a></nav></div></header>
<main><section><h1>Shopping Cart</h1><p class="notice">Your cart stays saved when you refresh the browser.</p><div id="cart-items"></div><div id="cart-summary" class="summary"></div></section></main><footer><p>&copy; 2026 Craft Trails. Handmade supplies for creative trails.</p></footer><script src="cart.js"></script><script>
function renderCart(){const c=getCart(),box=document.getElementById('cart-items'),sum=document.getElementById('cart-summary');if(!c.length){box.innerHTML='<div class="card"><h2>Your cart is empty</h2><a class="button" href="shop.html">Shop Products</a></div>';sum.innerHTML='';return}box.innerHTML=c.map(x=>`<article class="card cart-item"><img class="cart-thumb" src="images/${x.image}" alt="${x.name}"><div><h2>${x.name}</h2><p>Unit price: <strong>$${x.price.toFixed(2)}</strong></p><label for="q-${x.id}">Quantity</label><input id="q-${x.id}" type="number" min="0" value="${x.quantity}" onchange="changeQuantity('${x.id}',this.value)"><p>Item total: <strong>$${(x.price*x.quantity).toFixed(2)}</strong></p><button class="secondary-button" onclick="removeFromCart('${x.id}')">Remove Item</button></div></article>`).join('');sum.innerHTML=`<p class="cart-total">Current Total: $${cartTotal().toFixed(2)}</p><button class="secondary-button" onclick="clearCart()">Clear Entire Cart</button> <a class="button" href="checkout.html">Proceed to Checkout</a>`}renderCart();</script></body></html>
